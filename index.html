<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플 아이템메이커</title>
    <style>
        /* 1. 화이트 모드 기본값 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* 3. 상단 이름 설정 */
        header h1 {
            color: #f39c12;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        /* 4. 서버 선택 및 검색창 */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        select, input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input { width: 350px; }

        .btn-search {
            background-color: #f39c12;
            color: white;
            border: none;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* 5 & 6. 카테고리 레이아웃 */
        .category-section {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .category-group {
            margin-bottom: 30px;
        }

        .category-label {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-nav {
            background: #fff;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-nav:hover {
            border-color: #f39c12;
            color: #f39c12;
            background-color: #fff9f0;
        }

        /* 결과 창 */
        #display-area {
            margin-top: 40px;
            padding: 30px;
            background-color: #f9f9f9;
            border-radius: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍁 메이플 아이템메이커</h1>
    </header>

    <div class="search-box">
        <select id="server-select">
            <option>스카니아</option><option>루나</option><option>엘리시움</option>
            <option>크로아</option><option>오로라</option><option>베라</option>
            <option>레드</option><option>이노시스</option><option>유니온</option>
            <option>아케인</option><option>노바</option><option>리부트</option>
        </select>
        <input type="text" id="item-input" placeholder="아이템명은 풀 네임으로 작성바랍니다.">
        <button class="btn-search" onclick="doSearch()">검색</button>
    </div>

    <div class="category-section">
        <div class="category-group">
            <span class="category-label">명장루트 설정</span>
            <div class="btn-group">
                <button class="btn-nav">장비제작 명장루트</button>
                <button class="btn-nav">장신구제작 명장루트</button>
                <button class="btn-nav">연금술 명장루트</button>
            </div>
        </div>

        <div class="category-group">
            <span class="category-label">전문기술 카테고리</span>
            <div class="btn-group">
                <button class="btn-nav">채집</button>
                <button class="btn-nav">광물</button>
                <button class="btn-nav">장비제작</button>
                <button class="btn-nav">장신구제작</button>
                <button class="btn-nav">연금술</button>
            </div>
        </div>
    </div>

    <div id="display-area">
        아이템을 검색하거나 카테고리를 선택하세요.
    </div>
</div>

<script>
    function doSearch() {
        const server = document.getElementById('server-select').value;
        const item = document.getElementById('item-input').value;
        if(!item) return alert("아이템명을 입력해주세요.");
        
        document.getElementById('display-area').innerHTML = 
            `<strong>${server}</strong> 서버에서 <strong>${item}</strong>의 최저가를 검색합니다...`;
    }
</script>

</body>
</html>
