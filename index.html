<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메이플 프로듀스 - 제작 계산기</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; text-align: center; padding: 50px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #ff9800; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍁 메이플 프로듀스</h1>
        <p>아이템 이름을 입력하면 경매장 가격을 가져올 준비를 합니다.</p>
        <input type="text" placeholder="아이템 이름 입력">
        <button onclick="alert('아직 API 연동 전입니다!')">가격 조회</button>
    </div>
</body>
</html>
