<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플 아이템메이커</title>
    <style>
        /* 1. 화이트 모드 기본 설정 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #ffffff; 
            color: #333; 
            margin: 0; 
            padding: 0; 
        }

        /* 헤더 설정 */
        header { 
            padding: 40px 20px; 
            text-align: center; 
            border-bottom: 1px solid #f0f0f0; 
        }
        
        /* 3. 상단 이름 변경 */
        h1 { 
            color: #f39c12; 
            margin: 0; 
            font-size: 2.2em;
            letter-spacing: -1px;
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 40px 20px; 
        }

        /* 4. 서버 선택 및 검색창 (2. 안내문구 포함) */
        .search-container { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 50px; 
        }

        select { 
            padding: 15px; 
            border: 2px solid #eee; 
            border-radius: 10px; 
            font-size: 16px; 
            background-color: #fff;
            outline: none;
        }

        input[type="text"] { 
            width: 450px; 
            padding: 15px; 
            border: 2px solid #eee; 
            border-radius: 10px; 
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus { border-color: #f39c12; }

        .search-btn { 
            padding: 15px 30px; 
            background-color: #f39c12; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.2s;
        }

        .search-btn:hover { background-color: #d35400; }

            flex-direction: column;
            gap: 30px;
            text-align: center;
